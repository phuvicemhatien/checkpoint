<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0e7551">
  <title>CheckPoint</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-synthesis:none;color-scheme:light;--page:#f2f7f2;--surface:#fff;--text:#18352a;--muted:#52685d;--border:#d3e2d7;--primary:#087a50;--primary-deep:#075f40;--soft:#e8f5ec;--hero-a:#075d42;--hero-b:#159568;--shadow:0 10px 28px #173d2d12}
    :root[data-theme="ocean"]{--page:#f1f6fc;--surface:#fff;--text:#192f47;--muted:#50667d;--border:#d3deec;--primary:#1764a5;--primary-deep:#104c82;--soft:#e8f1fc;--hero-a:#124579;--hero-b:#2786bd;--shadow:0 10px 28px #17395b14}
    :root[data-theme="dark"]{color-scheme:dark;--page:#131a17;--surface:#1d2822;--text:#f0f6f1;--muted:#c0cec4;--border:#3b4c42;--primary:#40bd83;--primary-deep:#2ca36c;--soft:#263b30;--hero-a:#143c2d;--hero-b:#176044;--shadow:0 10px 28px #0005}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,color-mix(in srgb,var(--soft) 82%,transparent),transparent 48%),var(--page);color:var(--text);font-size:18px;line-height:1.5}.wrap{max-width:560px;margin:0 auto;padding:18px 16px 42px}
    .app-header{display:flex;align-items:center;gap:13px;margin:0 0 16px;padding:17px 16px;border-radius:20px;color:#fff;background:linear-gradient(130deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow)}.logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 3px 5px #0003)}.brand{font-size:1.35em;font-weight:800;letter-spacing:-.4px;line-height:1.2}.sub{font-size:.88em;color:#e4f4e9;margin-top:3px}.header-copy{min-width:0;flex:1}.settings-toggle{flex:none;border:1px solid #ffffff70;border-radius:12px;padding:10px 12px;background:#ffffff1b;color:#fff;font:inherit;font-size:.85em;font-weight:700;cursor:pointer;min-height:48px}.settings-toggle:active{background:#ffffff35}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
    label{display:block;font-weight:750;font-size:1em;margin:0 0 8px;color:var(--text)}input,.area-value{width:100%;min-height:56px;border:1.5px solid var(--border);border-radius:13px;padding:13px 15px;font:inherit;color:var(--text);background:var(--surface)}input::placeholder{color:var(--muted);opacity:.82}input:focus{outline:3px solid color-mix(in srgb,var(--primary) 24%,transparent);border-color:var(--primary)}.area-value{display:flex;align-items:center;color:var(--text);font-weight:650;background:var(--soft);border-color:transparent}
    .field{margin-bottom:18px}.hint{font-size:.86em;color:var(--muted);margin-top:7px}.button{width:100%;border:0;border-radius:14px;min-height:58px;background:linear-gradient(120deg,var(--primary),var(--primary-deep));color:#fff;font:inherit;font-size:1em;font-weight:800;cursor:pointer;box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 25%,transparent);transition:transform .12s,filter .12s}.button:active,.scan-button:active{transform:translateY(1px);filter:brightness(.95)}.button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.scan-button{width:100%;min-height:52px;margin:-2px 0 16px;border:1.5px solid var(--primary);border-radius:13px;background:var(--surface);color:var(--primary);font:inherit;font-weight:750;cursor:pointer}.scan-panel{margin:0 0 16px}.scan-panel[hidden]{display:none}.scan-video{display:block;width:100%;max-height:300px;background:#101613;border-radius:14px;object-fit:cover}.scan-close{margin-top:8px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:650;cursor:pointer;padding:8px}
    .status{display:none;margin-top:14px;padding:14px 15px;border-radius:13px;font-size:.94em;line-height:1.5;font-weight:600}.status.show{display:block}.status.info{background:#eaf2ff;color:#204f83}.status.success{background:#e4f5e9;color:#145c36}.status.error{background:#fff0e9;color:#87321e}:root[data-theme="dark"] .status.info{background:#26384c;color:#d7e9ff}:root[data-theme="dark"] .status.success{background:#244532;color:#d5f5df}:root[data-theme="dark"] .status.error{background:#4b3027;color:#ffe2d4}
    .history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.history-head h2,.settings-title{font-size:1.15em;margin:0;color:var(--text)}.text-button{border:0;border-radius:10px;background:var(--soft);color:var(--primary-deep);font:inherit;font-size:.86em;font-weight:750;cursor:pointer;padding:8px 12px;min-height:44px}.empty{color:var(--muted);font-size:.92em;padding:13px 0 4px}.item{padding:14px 0;border-top:1px solid var(--border)}.item:first-of-type{border-top:0}.item-title{font-weight:750;font-size:1em;color:var(--text)}.item-meta{font-size:.84em;color:var(--muted);margin-top:5px;line-height:1.5}.footer{text-align:center;color:var(--muted);font-size:.78em;padding:14px 8px}
    .settings-panel[hidden]{display:none}.settings-panel{border-top:4px solid var(--primary)}.settings-title{margin-bottom:16px}.setting-group{margin-top:16px}.setting-label{display:block;font-weight:750;font-size:.9em;margin-bottom:9px;color:var(--text)}.choice-row{display:flex;flex-wrap:wrap;gap:9px}.choice{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:.86em;font-weight:700;cursor:pointer}.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--soft);color:var(--primary-deep);box-shadow:inset 0 0 0 1px var(--primary)}.swatch{width:17px;height:17px;border-radius:50%;background:var(--swatch);border:1px solid #0002;flex:none}.settings-close{margin-top:16px}
    body[data-font-size="xlarge"]{font-size:20px}body[data-font-size="xlarge"] .wrap{max-width:590px}body[data-font-size="xlarge"] .logo{width:56px;height:56px}body[data-font-size="xlarge"] .app-header{padding:18px}body[data-font-size="xlarge"] .card{padding:22px}body[data-font-size="xlarge"] input,body[data-font-size="xlarge"] .area-value{min-height:62px}
    @media(max-width:380px){.wrap{padding:12px 12px 32px}.app-header{padding:14px 12px;gap:9px}.logo{width:44px;height:44px}.settings-toggle{padding:8px 9px}.card{padding:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="app-header"><svg class="logo" viewBox="0 0 48 48" role="img" aria-label="CheckPoint"><path fill="#e53935" d="M24 2C14.6 2 7 9.6 7 19c0 12.3 17 27 17 27s17-14.7 17-27C41 9.6 33.4 2 24 2Z"/><circle cx="24" cy="19" r="10.5" fill="#fff"/><path d="m18.5 19.3 3.7 3.7 7.5-8" fill="none" stroke="#17202a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="header-copy"><div class="brand">CheckPoint</div><div class="sub">Check-in theo khu vực</div></div><button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settingsPanel">⚙ Cài đặt</button></header>
    <section id="settingsPanel" class="card settings-panel" hidden aria-labelledby="settingsTitle"><h2 id="settingsTitle" class="settings-title">Cài đặt hiển thị</h2><div class="setting-group"><span class="setting-label">Cỡ chữ</span><div class="choice-row" role="group" aria-label="Chọn cỡ chữ"><button class="choice" type="button" data-font-choice="large" aria-pressed="true">Lớn</button><button class="choice" type="button" data-font-choice="xlarge" aria-pressed="false">Rất lớn</button></div></div><div class="setting-group"><span class="setting-label">Màu giao diện</span><div class="choice-row" role="group" aria-label="Chọn màu giao diện"><button class="choice" type="button" data-theme-choice="green" aria-pressed="true"><span class="swatch" style="--swatch:#087a50"></span>Xanh lá</button><button class="choice" type="button" data-theme-choice="ocean" aria-pressed="false"><span class="swatch" style="--swatch:#1764a5"></span>Xanh biển</button><button class="choice" type="button" data-theme-choice="dark" aria-pressed="false"><span class="swatch" style="--swatch:#35483d"></span>Tối</button></div></div><button id="settingsClose" class="text-button settings-close" type="button">Đóng cài đặt</button></section>
    <section class="card">
      <div class="field"><label for="name">Tên người dùng</label><input id="name" autocomplete="name" maxlength="80" placeholder="Nhập tên của anh/chị"><div class="hint">Tên sẽ được lưu trên điện thoại này để dùng lần sau.</div></div>
      <div class="field"><label>Khu vực từ mã QR</label><div id="areaValue" class="area-value" aria-live="polite">Chưa quét mã QR</div></div>
      <button id="scan" class="scan-button" type="button">Quét QR khu vực</button>
      <div id="scanPanel" class="scan-panel" hidden><video id="scanVideo" class="scan-video" autoplay playsinline="true" webkit-playsinline="true" muted controlslist="nofullscreen"></video><button id="stopScan" class="scan-close" type="button">Đóng camera</button></div>
      <button id="checkin" class="button" type="button" disabled>Lấy vị trí và check-in</button><div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section class="card"><div class="history-head"><h2>Lịch sử của tôi</h2><button class="text-button" id="refresh" type="button">Làm mới</button></div><div id="history"><div class="empty">Nhập tên để xem lịch sử check-in.</div></div></section>
    <div class="footer">Vị trí chỉ được gửi khi anh/chị bấm check-in.</div>
  </main>
  <iframe name="apiFrame" id="apiFrame" title="" hidden></iframe>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbwU_RFonVIUfw57nbJ4sFoVwOmNnh8w5R9-_ZxLZnF62XZv2Grq4Gj8n37uQs1cF48R/exec';
    const $=id=>document.getElementById(id),nameInput=$('name'),button=$('checkin'),statusBox=$('status');
    let cameraStream=null,scanActive=false,qrDetector=null,validAreas=[],matchedArea='',pendingNonce='',lastInvalidQr='',lastInvalidNoticeAt=0;
    const themeMeta=document.querySelector('meta[name="theme-color"]');
    function applyDisplaySettings(){const theme=localStorage.getItem('checkpoint-theme')||'green',fontSize=localStorage.getItem('checkpoint-font-size')||'large';document.documentElement.dataset.theme=['green','ocean','dark'].includes(theme)?theme:'green';document.body.dataset.fontSize=['large','xlarge'].includes(fontSize)?fontSize:'large';themeMeta.content=theme==='ocean'?'#124579':theme==='dark'?'#143c2d':'#075d42';document.querySelectorAll('[data-theme-choice]').forEach(option=>option.setAttribute('aria-pressed',String(option.dataset.themeChoice===document.documentElement.dataset.theme)));document.querySelectorAll('[data-font-choice]').forEach(option=>option.setAttribute('aria-pressed',String(option.dataset.fontChoice===document.body.dataset.fontSize)))}
    applyDisplaySettings();
    $('settingsToggle').addEventListener('click',()=>{const panel=$('settingsPanel'),open=panel.hidden;panel.hidden=!open;$('settingsToggle').setAttribute('aria-expanded',String(open));if(open)panel.scrollIntoView({behavior:'smooth',block:'nearest'})});
    $('settingsClose').addEventListener('click',()=>{$('settingsPanel').hidden=true;$('settingsToggle').setAttribute('aria-expanded','false');$('settingsToggle').focus()});
    document.querySelectorAll('[data-theme-choice]').forEach(option=>option.addEventListener('click',()=>{localStorage.setItem('checkpoint-theme',option.dataset.themeChoice);applyDisplaySettings()}));
    document.querySelectorAll('[data-font-choice]').forEach(option=>option.addEventListener('click',()=>{localStorage.setItem('checkpoint-font-size',option.dataset.fontChoice);applyDisplaySettings()}));
    nameInput.value=localStorage.getItem('checkpoint-name')||'';
    function showStatus(message,kind){statusBox.textContent=message;statusBox.className='status show '+kind}
    function apiJsonp(query,timeoutMs=10000){return new Promise((resolve,reject)=>{const cb='cp'+Date.now()+Math.floor(Math.random()*10000),script=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];script.remove();reject(new Error('Không kết nối được Apps Script.'))},timeoutMs);window[cb]=data=>{clearTimeout(timer);delete window[cb];script.remove();resolve(data)};script.onerror=()=>{clearTimeout(timer);delete window[cb];script.remove();reject(new Error('Không kết nối được Apps Script.'))};script.src=API_URL+'?'+query+'&callback='+cb;document.head.appendChild(script)})}
    function apiData(name){return apiJsonp('api=bootstrap&name='+encodeURIComponent(name||''),15000)}
    function loadApp(){apiData(nameInput.value).then(data=>{validAreas=data.areas||[];renderHistory(data.history||[])}).catch(error=>showStatus(error.message,'error'))}
    function acceptQr(raw){const text=String(raw||'').trim();matchedArea=validAreas.includes(text)?text:'';button.disabled=!matchedArea;if(matchedArea){$('areaValue').textContent=matchedArea;showStatus('Đã nhận khu vực: '+matchedArea,'success');return true}$('areaValue').textContent=text?'Đã đọc: '+text:'Không đọc được nội dung QR';showStatus('QR này không khớp tên khu vực trong tab KHU VỰC. Hãy quét mã đúng; camera vẫn đang mở.','error');return false}
    function loadHistory(){const name=nameInput.value.trim();if(!name){renderHistory([]);return}localStorage.setItem('checkpoint-name',name);apiData(name).then(data=>renderHistory(data.history||[])).catch(error=>showStatus(error.message,'error'))}
    function renderHistory(items){const host=$('history');host.replaceChildren();if(!nameInput.value.trim()){host.innerHTML='<div class="empty">Nhập tên để xem lịch sử check-in.</div>';return}if(!items.length){host.innerHTML='<div class="empty">Chưa có lượt check-in nào.</div>';return}items.forEach(item=>{const wrapper=document.createElement('div');wrapper.className='item';const title=document.createElement('div');title.className='item-title';title.textContent=item.area;const meta=document.createElement('div');meta.className='item-meta';const when=new Date(item.time);meta.textContent=(isNaN(when)?item.time:when.toLocaleString('vi-VN'))+' · cách điểm chuẩn '+item.distance+' m';wrapper.append(title,meta);host.append(wrapper)})}
    async function startScan(){matchedArea='';button.disabled=true;lastInvalidQr='';lastInvalidNoticeAt=0;$('areaValue').textContent='Đang mở camera…';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('areaValue').textContent='Chưa quét mã QR';showStatus('Trình duyệt không hỗ trợ mở camera. Hãy mở link bằng Chrome hoặc Safari mới nhất.','error');return}try{const video=$('scanVideo');video.playsInline=true;video.muted=true;video.controls=false;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.setAttribute('autoplay','');qrDetector='BarcodeDetector'in window?new BarcodeDetector({formats:['qr_code']}):null;if(!qrDetector&&typeof window.jsQR!=='function')throw new Error('Thiếu thư viện đọc QR');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=cameraStream;$('scanPanel').hidden=false;scanActive=true;await video.play();showStatus('Đưa mã QR vào khung camera.','info');requestAnimationFrame(scanFrame)}catch(error){await stopScan();$('areaValue').textContent='Chưa quét mã QR';showStatus('Không mở được camera. Hãy cho phép quyền camera cho trang CheckPoint trong trình duyệt.','error')}}
    async function scanFrame(){if(!scanActive)return;const video=$('scanVideo');if(video.readyState>=HTMLMediaElement.HAVE_ENOUGH_DATA){try{let raw='';if(qrDetector){const codes=await qrDetector.detect(video);if(codes.length)raw=String(codes[0].rawValue||'').trim()}else{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(video,0,0,canvas.width,canvas.height);const code=jsQR(context.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(code)raw=String(code.data||'').trim()}if(raw){if(validAreas.includes(raw)){await stopScan();acceptQr(raw);return}const now=Date.now();if(raw!==lastInvalidQr||now-lastInvalidNoticeAt>1800){lastInvalidQr=raw;lastInvalidNoticeAt=now;acceptQr(raw)}}}catch(error){await stopScan();$('areaValue').textContent='Chưa quét mã QR';showStatus('Không đọc được mã QR. Hãy đưa mã rõ hơn vào khung hình rồi quét lại.','error');return}}if(scanActive)requestAnimationFrame(scanFrame)}
    const scanVideo=$('scanVideo');
    function requestVideoInline(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});if(typeof scanVideo.webkitExitFullscreen==='function')scanVideo.webkitExitFullscreen();if(typeof scanVideo.webkitSetPresentationMode==='function'&&scanVideo.webkitPresentationMode==='fullscreen')scanVideo.webkitSetPresentationMode('inline')}catch(error){}}
    scanVideo.addEventListener('webkitbeginfullscreen',()=>{if(!scanActive){requestVideoInline();setTimeout(requestVideoInline,120);setTimeout(requestVideoInline,360)}});
    async function stopScan(){scanActive=false;const video=scanVideo;let ended=false;const onEnd=()=>{ended=true};video.addEventListener('webkitendfullscreen',onEnd,{once:true});requestVideoInline();for(let attempt=0;attempt<18;attempt++){if(ended||(!video.webkitDisplayingFullscreen&&document.fullscreenElement!==video&&attempt>=3))break;requestVideoInline();await new Promise(resolve=>setTimeout(resolve,120))}video.removeEventListener('webkitendfullscreen',onEnd);try{video.pause()}catch(error){}if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;video.srcObject=null;video.removeAttribute('src');video.load();$('scanPanel').hidden=true}
    async function postCheckin(request){pendingNonce='n'+Date.now()+Math.random().toString(36).slice(2);const nonce=pendingNonce,form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='apiFrame';form.style.display='none';Object.entries({...request,nonce}).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=String(value);form.appendChild(input)});document.body.appendChild(form);form.submit();const deadline=Date.now()+60000;try{while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1200));const response=await apiJsonp('api=checkinResult&nonce='+encodeURIComponent(nonce),10000);if(response){pendingNonce='';form.remove();if(response.ok)return response.result;throw new Error(response.message||'Không ghi nhận được check-in.')}}throw new Error('Chưa nhận được xác nhận từ máy chủ. Đừng bấm check-in lại ngay; hãy làm mới lịch sử để kiểm tra lượt vừa gửi.')}finally{form.remove()}}
    function positionOnce(options,watchdogMs){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>finish(new Error('Không nhận được vị trí trong thời gian chờ.')),watchdogMs);function finish(error,value){if(settled)return;settled=true;clearTimeout(timer);if(error)reject(error);else resolve(value)}try{navigator.geolocation.getCurrentPosition(position=>finish(null,position),error=>finish(error),options)}catch(error){finish(error)}})}
    async function getPositionForCheckIn(){try{showStatus('Đang tìm vị trí GPS chính xác… iPhone có thể cần vài giây để bắt tín hiệu.','info');return await positionOnce({enableHighAccuracy:true,timeout:20000,maximumAge:0},23000)}catch(error){if(error.code===1)throw error;showStatus('GPS chính xác chưa phản hồi. Đang thử lấy vị trí dự phòng…','info');return await positionOnce({enableHighAccuracy:false,timeout:15000,maximumAge:0},17000)}}
    async function beginCheckIn(){const name=nameInput.value.trim();if(!name){showStatus('Anh/chị vui lòng nhập tên.','error');nameInput.focus();return}if(!matchedArea){showStatus('Vui lòng quét mã QR của khu vực trước.','error');return}if(!navigator.geolocation){showStatus('Trình duyệt không hỗ trợ lấy vị trí GPS. Hãy mở link bằng Safari hoặc Chrome.','error');return}localStorage.setItem('checkpoint-name',name);button.disabled=true;button.textContent='Đang xin vị trí…';try{const position=await getPositionForCheckIn();button.textContent='Đang gửi check-in…';showStatus('Đã nhận vị trí (độ chính xác khoảng '+Math.round(position.coords.accuracy)+' m). Đang gửi check-in…','info');const result=await postCheckin({name,qrText:matchedArea,lat:position.coords.latitude,lng:position.coords.longitude,accuracy:position.coords.accuracy});if(result.ok){showStatus('Check-in thành công. Khoảng cách tới điểm chuẩn: '+result.distance+' m.','success');loadHistory()}else showStatus('Bạn đang ở ngoài khu vực check-in ('+result.distance+' m; giới hạn '+result.radius+' m).','error')}catch(error){const message=error.code===1?'iPhone chưa cấp quyền vị trí cho trình duyệt. Vào Cài đặt > Quyền riêng tư & Bảo mật > Dịch vụ định vị, bật Dịch vụ định vị và cho phép Safari/Chrome khi dùng trang.':error.code===3||/thời gian chờ/.test(error.message)?'iPhone chưa trả vị trí kịp thời. Bật Vị trí chính xác cho Safari/Chrome, tắt Chế độ nguồn điện thấp nếu đang bật, rồi thử gần cửa sổ hoặc ngoài trời.':'Không lấy được vị trí. Kiểm tra Dịch vụ định vị và quyền Vị trí chính xác của Safari/Chrome trong Cài đặt iPhone.';showStatus(message,'error')}finally{button.textContent='Lấy vị trí và check-in';button.disabled=!matchedArea}}
    $('scan').addEventListener('click',startScan);$('stopScan').addEventListener('click',stopScan);button.addEventListener('click',beginCheckIn);$('refresh').addEventListener('click',loadHistory);nameInput.addEventListener('change',loadHistory);loadApp();
  </script>
</body>
</html>
