<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#16834c">
  <title>CheckPoint</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17202a;background:#f3f6f4;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}
    header{display:flex;align-items:center;gap:12px;margin:5px 2px 20px}.logo{width:48px;height:48px;flex:none}.brand{font-size:23px;font-weight:750;letter-spacing:-.4px}.sub{font-size:13px;color:#69756e;margin-top:2px}
    .card{background:white;border:1px solid #e5ebe7;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #263c2d0a}
    label{display:block;font-weight:650;font-size:14px;margin:0 0 8px}input,.area-value{width:100%;min-height:48px;border:1px solid #d5ded8;border-radius:11px;padding:12px 13px;font:inherit;color:inherit;background:white}.area-value{display:flex;align-items:center;color:#526158}
    .field{margin-bottom:16px}.hint{font-size:12px;color:#718078;margin-top:6px}.button{width:100%;border:0;border-radius:12px;min-height:50px;background:#16834c;color:white;font:inherit;font-size:16px;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:not-allowed}.scan-button{width:100%;min-height:44px;margin:-5px 0 16px;border:1px solid #16834c;border-radius:11px;background:#fff;color:#16834c;font:inherit;font-weight:650;cursor:pointer}.scan-panel{margin:0 0 16px}.scan-panel[hidden]{display:none}.scan-video{display:block;width:100%;max-height:280px;background:#101613;border-radius:12px;object-fit:cover}.scan-close{margin-top:8px;border:0;background:transparent;color:#69756e;font:inherit;cursor:pointer}
    .status{display:none;margin-top:13px;padding:12px;border-radius:11px;font-size:14px;line-height:1.45}.status.show{display:block}.status.info{background:#eef5ff;color:#214d82}.status.success{background:#e9f7ee;color:#146b39}.status.error{background:#fff1ed;color:#a53620}
    .history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.history-head h2{font-size:17px;margin:0}.text-button{border:0;background:transparent;color:#137746;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px}.empty{color:#78847d;font-size:14px;padding:13px 0 4px}.item{padding:12px 0;border-top:1px solid #edf1ee}.item:first-of-type{border-top:0}.item-title{font-weight:650;font-size:14px}.item-meta{font-size:12px;color:#718078;margin-top:4px;line-height:1.45}.footer{text-align:center;color:#859089;font-size:11px;padding:9px}
  </style>
</head>
<body>
  <main class="wrap">
    <header><svg class="logo" viewBox="0 0 48 48" role="img" aria-label="CheckPoint"><path fill="#e53935" d="M24 2C14.6 2 7 9.6 7 19c0 12.3 17 27 17 27s17-14.7 17-27C41 9.6 33.4 2 24 2Z"/><circle cx="24" cy="19" r="10.5" fill="#fff"/><path d="m18.5 19.3 3.7 3.7 7.5-8" fill="none" stroke="#17202a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="brand">CheckPoint</div><div class="sub">Check-in theo khu vực</div></div></header>
    <section class="card">
      <div class="field"><label for="name">Tên người dùng</label><input id="name" autocomplete="name" maxlength="80" placeholder="Nhập tên của anh/chị"><div class="hint">Tên sẽ được lưu trên điện thoại này để dùng lần sau.</div></div>
      <div class="field"><label>Khu vực từ mã QR</label><div id="areaValue" class="area-value" aria-live="polite">Chưa quét mã QR</div></div>
      <button id="scan" class="scan-button" type="button">Quét QR khu vực</button>
      <div id="scanPanel" class="scan-panel" hidden><video id="scanVideo" class="scan-video" autoplay playsinline muted></video><button id="stopScan" class="scan-close" type="button">Đóng camera</button></div>
      <button id="checkin" class="button" type="button" disabled>Lấy vị trí và check-in</button><div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section class="card"><div class="history-head"><h2>Lịch sử của tôi</h2><button class="text-button" id="refresh" type="button">Làm mới</button></div><div id="history"><div class="empty">Nhập tên để xem lịch sử check-in.</div></div></section>
    <div class="footer">Vị trí chỉ được gửi khi anh/chị bấm check-in.</div>
  </main>
  <iframe name="apiFrame" id="apiFrame" title="" hidden></iframe>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbwU_RFonVIUfw57nbJ4sFoVwOmNnh8w5R9-_ZxLZnF62XZv2Grq4Gj8n37uQs1cF48R/exec';
    const $=id=>document.getElementById(id),nameInput=$('name'),button=$('checkin'),statusBox=$('status');
    let cameraStream=null,scanActive=false,qrDetector=null,validAreas=[],matchedArea='',pendingNonce='';
    nameInput.value=localStorage.getItem('checkpoint-name')||'';
    function showStatus(message,kind){statusBox.textContent=message;statusBox.className='status show '+kind}
    function apiData(name){return new Promise((resolve,reject)=>{const cb='cp'+Date.now()+Math.floor(Math.random()*10000),script=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];script.remove();reject(new Error('Không tải được dữ liệu từ bảng.'))},15000);window[cb]=data=>{clearTimeout(timer);delete window[cb];script.remove();resolve(data)};script.onerror=()=>{clearTimeout(timer);delete window[cb];script.remove();reject(new Error('Không kết nối được Apps Script.'))};script.src=API_URL+'?api=bootstrap&callback='+cb+'&name='+encodeURIComponent(name||'');document.head.appendChild(script)})}
    function loadApp(){apiData(nameInput.value).then(data=>{validAreas=data.areas||[];renderHistory(data.history||[])}).catch(error=>showStatus(error.message,'error'))}
    function acceptQr(raw){const text=String(raw||'').trim();matchedArea=validAreas.includes(text)?text:'';$('areaValue').textContent=matchedArea||'QR không khớp khu vực nào trong sheet';button.disabled=!matchedArea;showStatus(matchedArea?'Đã nhận khu vực: '+matchedArea:'Nội dung QR không khớp tên khu vực trong tab KHU VỰC.',matchedArea?'success':'error')}
    function loadHistory(){const name=nameInput.value.trim();if(!name){renderHistory([]);return}localStorage.setItem('checkpoint-name',name);apiData(name).then(data=>renderHistory(data.history||[])).catch(error=>showStatus(error.message,'error'))}
    function renderHistory(items){const host=$('history');host.replaceChildren();if(!nameInput.value.trim()){host.innerHTML='<div class="empty">Nhập tên để xem lịch sử check-in.</div>';return}if(!items.length){host.innerHTML='<div class="empty">Chưa có lượt check-in nào.</div>';return}items.forEach(item=>{const wrapper=document.createElement('div');wrapper.className='item';const title=document.createElement('div');title.className='item-title';title.textContent=item.area;const meta=document.createElement('div');meta.className='item-meta';const when=new Date(item.time);meta.textContent=(isNaN(when)?item.time:when.toLocaleString('vi-VN'))+' · cách điểm chuẩn '+item.distance+' m';wrapper.append(title,meta);host.append(wrapper)})}
    async function startScan(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showStatus('Trình duyệt không hỗ trợ mở camera. Hãy mở link bằng Chrome hoặc Safari mới nhất.','error');return}try{qrDetector='BarcodeDetector'in window?new BarcodeDetector({formats:['qr_code']}):null;if(!qrDetector&&typeof window.jsQR!=='function')throw new Error('Thiếu thư viện đọc QR');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('scanVideo').srcObject=cameraStream;$('scanPanel').hidden=false;scanActive=true;await $('scanVideo').play();requestAnimationFrame(scanFrame)}catch(error){stopScan();showStatus('Không mở được camera. Hãy cho phép quyền camera cho trang CheckPoint trong trình duyệt.','error')}}
    async function scanFrame(){if(!scanActive)return;const video=$('scanVideo');if(video.readyState>=HTMLMediaElement.HAVE_ENOUGH_DATA){try{let raw='';if(qrDetector){const codes=await qrDetector.detect(video);if(codes.length)raw=String(codes[0].rawValue||'').trim()}else{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage(video,0,0,canvas.width,canvas.height);const code=jsQR(context.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(code)raw=code.data}if(raw){stopScan();acceptQr(raw);return}}catch(error){stopScan();showStatus('Không đọc được mã QR. Hãy đưa mã rõ hơn vào khung hình.','error');return}}requestAnimationFrame(scanFrame)}
    function stopScan(){scanActive=false;if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;$('scanVideo').srcObject=null;$('scanPanel').hidden=true}
    function postCheckin(request){return new Promise((resolve,reject)=>{pendingNonce='n'+Date.now()+Math.random().toString(36).slice(2);const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='apiFrame';form.style.display='none';Object.entries({...request,nonce:pendingNonce}).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=String(value);form.appendChild(input)});document.body.appendChild(form);const timeout=setTimeout(()=>{form.remove();pendingNonce='';reject(new Error('Máy chủ phản hồi quá lâu. Hãy thử lại.'))},20000);window.addEventListener('message',function onMessage(event){if(event.data?.type!=='checkpoint-result'||event.data?.payload?.nonce!==pendingNonce)return;window.removeEventListener('message',onMessage);clearTimeout(timeout);pendingNonce='';form.remove();if(event.data.payload.ok)resolve(event.data.payload.result);else reject(new Error(event.data.payload.message||'Không ghi nhận được check-in.'))});form.submit()})}
    function beginCheckIn(){const name=nameInput.value.trim();if(!name){showStatus('Anh/chị vui lòng nhập tên.','error');nameInput.focus();return}if(!matchedArea){showStatus('Vui lòng quét mã QR của khu vực trước.','error');return}if(!navigator.geolocation){showStatus('Trình duyệt không hỗ trợ lấy vị trí GPS.','error');return}localStorage.setItem('checkpoint-name',name);button.disabled=true;button.textContent='Đang lấy vị trí…';showStatus('Đang xác nhận vị trí…','info');navigator.geolocation.getCurrentPosition(async position=>{button.textContent='Đang ghi nhận check-in…';const coords=position.coords;try{const result=await postCheckin({name,qrText:matchedArea,lat:coords.latitude,lng:coords.longitude,accuracy:coords.accuracy});button.textContent='Lấy vị trí và check-in';button.disabled=!matchedArea;if(result.ok){showStatus('Check-in thành công. Khoảng cách tới điểm chuẩn: '+result.distance+' m.','success');loadHistory()}else showStatus('Bạn đang ở ngoài khu vực check-in ('+result.distance+' m; giới hạn '+result.radius+' m).','error')}catch(error){button.textContent='Lấy vị trí và check-in';button.disabled=!matchedArea;showStatus(error.message,'error')}},error=>{button.textContent='Lấy vị trí và check-in';button.disabled=!matchedArea;showStatus(error.code===1?'Chưa cấp quyền vị trí. Hãy cho phép quyền vị trí trong trình duyệt.':error.code===3?'Lấy vị trí quá lâu. Hãy thử ở nơi có tín hiệu GPS tốt hơn.':'Không lấy được GPS. Hãy bật Dịch vụ vị trí trong cài đặt điện thoại.','error')},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
    $('scan').addEventListener('click',startScan);$('stopScan').addEventListener('click',stopScan);button.addEventListener('click',beginCheckIn);$('refresh').addEventListener('click',loadHistory);nameInput.addEventListener('change',loadHistory);loadApp();
    if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>{},()=>{}, {enableHighAccuracy:true,timeout:12000,maximumAge:0});
    if(navigator.mediaDevices?.getUserMedia)navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(stream=>stream.getTracks().forEach(track=>track.stop())).catch(()=>{});
  </script>
</body>
</html>
